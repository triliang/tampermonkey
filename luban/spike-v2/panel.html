<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鲁班 V2 P0 · 真实运行探针</title><style>body{font:14px/1.7 system-ui;max-width:1050px;padding:28px;margin:auto;color:#24382c;background:#f5f7f3}button{padding:10px 14px;margin:5px;border:1px solid #cad8c9;border-radius:7px;background:white;color:#24543c;cursor:pointer}h1{font-size:24px}pre{background:white;border:1px solid #dce5d8;padding:18px;border-radius:8px;white-space:pre-wrap;word-break:break-word}fieldset{border:1px solid #dce5d8;margin:15px 0;border-radius:8px}#status{font-weight:650;color:#256046}p{font-size:12px;color:#667461}</style><h1>鲁班 V2 · P0 真实运行探针</h1><p>独立测试扩展 · 只请求 http://localhost/* · 数据库 luban-v2-p0 · 不调用模型、不读取正式鲁班数据。每个结果来自真实 Chrome API。</p><fieldset><legend>1. 环境与授权</legend><button id="grant">授权本地测试网站</button><button data-command="api">检查 userScripts API</button><button data-command="status">刷新状态</button><button id="fixture">新开匹配页面</button><button id="other">新开不匹配页面</button></fieldset><fieldset><legend>2. 注册、桥与版本门禁</legend><button data-command="install">安装 A 与内容桥</button><button data-command="noBridge">移除内容桥</button><button data-command="addBridge">恢复内容桥</button><button data-command="candidate">注册未提交 B</button><button data-command="commit">提交 B</button><button data-command="recover">恢复已提交注册</button><button data-command="manual">userScripts.execute 手动探针</button><button data-command="disable">停用并卸载探针</button></fieldset><fieldset><legend>3. 数据与兼容</legend><button data-command="idb">IDB 跨记录事务中止</button><button data-command="capacity">容量拒绝保护</button><button data-command="info">GM_info 标准与旧调用</button><button id="download">导出证据 JSON</button></fieldset><div role="status" id="status">加载中</div><pre id="output">等待读取…</pre><script src="panel.js"></script></html>
