<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>鲁班 Spike · 注入验证</title>
    <!--
      MV3 扩展页默认 CSP 为 script-src 'self'：禁止内联 <script> 与 on* 事件属性。
      因此所有逻辑放在外部 panel.js，事件用 addEventListener 绑定。内联 <style> 不受该 CSP 限制。
    -->
    <style>
      :root {
        --bg: #0f1115;
        --card: #181b22;
        --fg: #e6e8ec;
        --muted: #9aa3b2;
        --accent: #e0245b;
        --ok: #22c55e;
        --warn: #f59e0b;
        --err: #ef4444;
        --border: #262b35;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 14px;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.55 -apple-system, system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      h1 { font-size: 15px; margin: 0 0 4px; }
      .sub { color: var(--muted); font-size: 12px; margin: 0 0 14px; }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 12px;
      }
      .card h2 { font-size: 13px; margin: 0 0 10px; color: var(--fg); }
      label.row {
        display: flex; align-items: flex-start; gap: 8px;
        padding: 7px 8px; border-radius: 8px; cursor: pointer;
      }
      label.row:hover { background: #1f2430; }
      label.row input { margin-top: 2px; }
      .row .name { font-weight: 600; }
      .row .desc { color: var(--muted); font-size: 11.5px; }
      .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
      button {
        background: #232936; color: var(--fg); border: 1px solid var(--border);
        border-radius: 8px; padding: 8px 12px; font-size: 12.5px; cursor: pointer;
      }
      button:hover { border-color: #3a4252; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
      button:disabled { opacity: .5; cursor: not-allowed; }
      .hint {
        color: var(--muted); font-size: 11.5px; margin-top: 10px;
        border-left: 2px solid var(--border); padding-left: 8px;
      }
      .rec { border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 10px; background: #12151b; }
      .rec .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
      .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
      .badge.ok { background: rgba(34,197,94,.15); color: var(--ok); }
      .badge.err { background: rgba(239,68,68,.15); color: var(--err); }
      .badge.m { background: rgba(224,36,91,.15); color: #ff7aa2; }
      .kv { display: grid; grid-template-columns: 84px 1fr; gap: 3px 8px; font-size: 12px; }
      .kv .k { color: var(--muted); }
      .kv .v { word-break: break-all; }
      pre {
        background: #0b0d12; border: 1px solid var(--border); border-radius: 6px;
        padding: 8px; overflow: auto; font-size: 11px; max-height: 160px; margin: 6px 0 0;
      }
      .empty { color: var(--muted); font-size: 12px; }
      code { background: #0b0d12; padding: 1px 5px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>鲁班 Luban · 注入验证 Spike</h1>
    <p class="sub">Phase 0 · MAIN world 注入可行性 + 三级降级链 CSP 行为</p>

    <div class="card">
      <h2>注入方法开关</h2>
      <label class="row">
        <input type="radio" name="method" value="1" />
        <span>
          <span class="name">Method 1 · executeScript({world:'MAIN'})</span><br />
          <span class="desc">浏览器级注入，绕过页面 CSP（MVP 主路径）</span>
        </span>
      </label>
      <label class="row">
        <input type="radio" name="method" value="2" />
        <span>
          <span class="name">Method 2 · &lt;script&gt; textContent</span><br />
          <span class="desc">ISOLATED 建标签内联注入，受 script-src 约束</span>
        </span>
      </label>
      <label class="row">
        <input type="radio" name="method" value="3" />
        <span>
          <span class="name">Method 3 · Blob URL &lt;script src&gt;</span><br />
          <span class="desc">Blob 加载，受 script-src blob: 约束</span>
        </span>
      </label>
      <label class="row">
        <input type="radio" name="method" value="auto" />
        <span>
          <span class="name">Auto · 降级链 1→2→3</span><br />
          <span class="desc">依次尝试，命中即停，记录每步结果</span>
        </span>
      </label>

      <div class="btns">
        <button id="save" class="primary">保存方法</button>
        <button id="run">在此页运行</button>
        <button id="clear">清空记录</button>
      </div>
      <p class="hint">
        推荐流程：选好方法 →「保存方法」→ <b>点击浏览器工具栏的扩展图标</b> 触发注入
        （点击图标才会授予当前页 activeTab 权限）。<br />
        「在此页运行」为便捷入口，仅在图标已点过（授权仍有效）时可用。<br />
        验证 MAIN world：在页面 Console 把上下文切到 <b>top</b>，执行 <code>__luban_poc</code> 应输出 <code>true</code>。
      </p>
    </div>

    <div class="card">
      <h2>注入记录（最近在上）</h2>
      <div class="btns" style="margin-top:0;margin-bottom:10px;">
        <button id="copy">复制最近结果 JSON</button>
        <button id="copyAll">复制全部记录 JSON</button>
      </div>
      <div id="results"><p class="empty">暂无记录。点击工具栏扩展图标开始验证。</p></div>
    </div>

    <script src="panel.js"></script>
  </body>
</html>
