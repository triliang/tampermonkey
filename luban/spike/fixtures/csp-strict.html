<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      严格 CSP：script-src 'self'（无 unsafe-inline、无 blob:）。
      预期：
        Method 1 (executeScript MAIN) → ✓ 成功（浏览器级注入，绕过页面 CSP）
        Method 2 (<script> textContent 内联) → ✗ 被 script-src 拦截（触发 securitypolicyviolation）
        Method 3 (Blob URL <script src>) → ✗ 被拦截（'self' 不含 blob:）
      这是 P0-T2 验收 ② 的核心测试页。
      必须经 HTTP 同源服务打开（如 python3 -m http.server），file:// 下 'self' 为 opaque 源，行为不可靠。
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'" />
    <title>CSP 测试页 · script-src 'self'（严格）</title>
    <style>
      body { font: 14px/1.6 -apple-system, system-ui, 'PingFang SC', sans-serif; margin: 24px; color: #222; }
      .tag { display: inline-block; background: #e0245b; color: #fff; padding: 2px 10px; border-radius: 6px; font-size: 12px; }
      #csp-log { margin-top: 16px; padding: 12px; background: #f6f7f9; border: 1px solid #e2e5ea; border-radius: 8px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; min-height: 40px; }
      a { margin-right: 12px; }
      h2 { margin-top: 28px; }
      table { border-collapse: collapse; margin-top: 8px; }
      td, th { border: 1px solid #ddd; padding: 4px 10px; font-size: 13px; text-align: left; }
    </style>
  </head>
  <body>
    <span class="tag">CSP: script-src 'self'</span>
    <h1>严格 CSP 测试页</h1>
    <p>本页只允许同源外部脚本，禁止内联与 blob。用于验证降级链在严格 CSP 下的行为。</p>

    <h2>链接（注入成功后应变红）</h2>
    <p>
      <a href="#a1">链接 A</a>
      <a href="#a2">链接 B</a>
      <a href="#a3">链接 C</a>
    </p>

    <h2>预期结果</h2>
    <table>
      <tr><th>方法</th><th>预期</th><th>原因</th></tr>
      <tr><td>Method 1</td><td>✓ 成功</td><td>executeScript world:MAIN 为浏览器级注入，绕过页面 CSP</td></tr>
      <tr><td>Method 2</td><td>✗ 拦截</td><td>内联脚本违反 script-src 'self'（无 unsafe-inline）</td></tr>
      <tr><td>Method 3</td><td>✗ 拦截</td><td>blob: 不在 script-src 允许列表</td></tr>
    </table>

    <h2>CSP violation 日志</h2>
    <div id="csp-log"></div>

    <!-- 同源外部脚本：script-src 'self' 允许 -->
    <script src="csp-reporter.js"></script>
  </body>
</html>
