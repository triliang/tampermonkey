<script>
'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let mode='local',messages=[],records=[],current=null,artifact=null,saved=null,previous=null,runVersion=null,version=0,epoch=0,busy=false,pending=false,online=true,authorized=true,pageValid=true,feishu=true,replyFail=false,sendUnknown=false,requestSeq=0,externalLog=[],modalKind='',returnFocus=null,follow=true,toastTimer;

function executor(){return $('#executor').value==='codex'?'Codex · 本地 Agent':'第三方模型 · 已有配置'}
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),3000);$('#live').textContent=t}

function close(){ $('#modal').close();if(returnFocus?.isConnected)returnFocus.focus();else $('#input').focus() }
function action(label,id,primary=false,disabled=false){return `<button class="btn ${primary?'primary':''}" data-action="${id}" ${disabled?'disabled':''}>${label}</button>`}
function add(role,text,extra={}){messages.push({role,text,...extra});follow=true;render()}
function task(source,text){const t={id:'LB-'+String(++requestSeq).padStart(3,'0'),source,text,status:'等待执行',executor:executor(),page:'www.douban.com / explore',reply:'未发送',time:new Date().toLocaleTimeString('zh-CN',{hour12:false})};records.unshift(t);current=t;return t}
function stage(){if(mode==='local'){$('#stage').innerHTML=`<div class="page-nav"><strong>豆瓣 · 发现</strong><span class="muted">阅读 &nbsp; / &nbsp; 生活 &nbsp; / &nbsp; 记录</span></div><span class="eyebrow">A little space for yourself</span><h1>把日常，留给喜欢的事。</h1><p class="stage-desc">安静地阅读，慢慢地发现。让一个小工具，把网页变成你喜欢的样子。</p><div class="page-grid"><article><div class="cover"><span>the quiet things</span></div><h2 class="article-title">找到属于自己的阅读时刻</h2><p class="article-text">一扇窗，一本书，还有不被打扰的时间。<br>从身边的小事开始，发现日常的另一面。</p><div class="article-item">周末散步计划<small>生活方式 · 今日推荐</small></div><div class="article-item">那些值得慢慢阅读的书<small>阅读 · 与日常相遇</small></div></article><aside><div class="ad" id="demo-ad"><div class="ad-art">a slow weekend</div><strong>给生活一点留白</strong><small>周末手作体验 · 广告</small></div><div class="placeholder hidden" id="removed">广告模块已隐藏<br>相邻推荐保持不变</div><div class="neighbor"><strong>值得关注</strong><p>春日散步指南 ↗</p><p>本周新书与好电影 ↗</p></div></aside></div><p class="page-note">示例网页 · 点击鲁班的试运行后观察效果</p>`;return}if(mode==='mcp'){$('#stage').innerHTML=`<div class="external-head"><span class="app-logo">⌘</span><div><strong>Cursor</strong><p class="muted" style="font-size:11px">本地 Agent → 鲁班 MCP</p></div><span class="tag" style="margin-left:auto">客户端模拟</span></div><span class="eyebrow">Your browser, in reach</span><h1>让 Agent，接上当前网页。</h1><p class="stage-desc">只开放你选定的页面。草稿与操作申请会回到右侧鲁班，等待你检查和确认。</p><div class="external-box"><div class="extbar">Agent 会话 &nbsp; / &nbsp; 鲁班 MCP</div><div class="terminal"><strong>› 整理这个页面，隐藏完整广告模块</strong><div class="output" id="external-output"></div></div><div class="ext-actions"><button class="btn" data-action="read-page">读取授权页面</button><button class="btn primary" data-action="external">提交草稿与运行申请</button></div></div><div class="explain">此场景验证什么？<ol><li>读取只发生在授权页面范围内</li><li>外部提交不会覆盖已保存版本</li><li>网页写操作回到鲁班本地确认</li></ol></div>`}else{$('#stage').innerHTML=`<div class="external-head"><span class="app-logo" style="background:#e8eef3;color:#668ba1">飞</span><div><strong>鲁班助 document.addEventListener('click',e=>{const button=e.target.closest('[data-action]');if(button&&!button.disabled)handlers[button.dataset.action]?.(button)});$('#send').onclick=send;$('#input').oninput=()=>{const t=$('#input');t.style.height='auto';t.style.height=Math.min(110,Math.max(48,t.scrollHeight))+'px';render()};$('#input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}};$('#executor').onchange=()=>{toast('下一轮将使用 '+executor()+'；基线保留，新执行方仅接收必要历史摘要');render()};$('#scenario').onchange=()=>{mode=$('#scenario').value;reset()};$('#reset').onclick=reset;$('#narrow').onclick=()=>{document.body.classList.toggle('narrow');$('#narrow').textContent=document.body.classList.contains('narrow')?'宽侧栏':'窄侧栏'};$('#faults').onclick=faults;$('#connections').onclick=connections;$('#tasks').onclick=tasks;$('#context').onclick=context;$('#scope').onclick=scope;$('#external-mobile').onclick=external;$('#close-modal').onclick=close;$('#modal').addEventListener('cancel',e=>{e.preventDefault();close()});$('#scroll').onscroll=()=>{const s=$('#scroll');follow=s.scrollHeight-s.scrollTop-s.clientHeight<45;$('#latest').classList.toggle('hidden',follow)};$('#latest').onclick=()=>{follow=true;$('#scroll').scrollTop=$('#scroll').scrollHeight;$('#latest').classList.add('hidden')};reset();
